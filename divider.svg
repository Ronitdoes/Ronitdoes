<svg width="900" height="24" viewBox="0 0 900 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Traveling neon red highlight with soft decay tail matching header -->
    <linearGradient id="travelRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2C2C" stop-opacity="0" />
      <stop offset="25%" stop-color="#FF2C2C" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#FF2C2C" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#FF2C2C" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF2C2C" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle neon glow filter -->
    <filter id="redGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep dark canvas background matching header -->
  <rect width="900" height="24" rx="6" fill="#0a0a0a" />

  <!-- Subtle baseline line (dim red) -->
  <line x1="0" y1="12" x2="900" y2="12" stroke="#FF2C2C" stroke-width="0.5" opacity="0.22" />

  <!-- Animated traveling neon red pulse across the divider in sync with 5.2s header sweep -->
  <rect x="-240" y="9" width="220" height="6" rx="3" fill="url(#travelRed)" filter="url(#redGlow)" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" from="-240 0" to="1140 0" dur="5.2s" repeatCount="indefinite" />
  </rect>

  <!-- Outer corner accents -->
  <circle cx="12" cy="12" r="2.5" fill="#FF2C2C" opacity="0.6" />
  <circle cx="888" cy="12" r="2.5" fill="#FF2C2C" opacity="0.6" />

  <!-- Small tick marks -->
  <line x1="150" y1="9" x2="150" y2="15" stroke="#FF2C2C" stroke-width="0.8" opacity="0.3" />
  <line x1="300" y1="9" x2="300" y2="15" stroke="#FF2C2C" stroke-width="0.8" opacity="0.3" />
  <line x1="600" y1="9" x2="600" y2="15" stroke="#FF2C2C" stroke-width="0.8" opacity="0.3" />
  <line x1="750" y1="9" x2="750" y2="15" stroke="#FF2C2C" stroke-width="0.8" opacity="0.3" />

  <!-- Center focal diamond matching the period dot styling -->
  <polygon points="450,6.5 455.5,12 450,17.5 444.5,12" fill="none" stroke="#FF2C2C" stroke-width="1.2" opacity="0.7" />
  <circle cx="450" cy="12" r="2" fill="#FF2C2C" filter="url(#redGlow)" opacity="0.95" />
</svg>
